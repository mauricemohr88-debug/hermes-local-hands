[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hermes-local-hands"
version = "0.1.1"
description = "A consent-gated local companion for remote Hermes agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Maurice Mohr" }]
keywords = ["hermes", "agents", "automation", "security", "mcp", "git"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "cryptography>=50,<51",
  "mcp>=2.1,<3",
  "uvicorn>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/mauricemohr88-debug/hermes-local-hands"
Documentation = "https://github.com/mauricemohr88-debug/hermes-local-hands#readme"
Issues = "https://github.com/mauricemohr88-debug/hermes-local-hands/issues"
Source = "https://github.com/mauricemohr88-debug/hermes-local-hands"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx>=0.28,<1",
  "pip-audit>=2.10,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
  "twine>=6,<7",
]

[project.scripts]
hermes-local-hands = "hermes_local_hands.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_local_hands"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
